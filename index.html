<style>/* 共通: ステッカー帳スタイル。太いインクの輪郭とずらした影。各アプリが :root で色を上書きする */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#1d1630;
  --paper:#ffffff;
  --muted:#5d5470;
  --line:#1d1630;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --r:18px;
  color-scheme:light;
}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-inline:16px;padding-block:20px 48px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.hero{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.hero h1{font-size:clamp(34px,10vw,52px);letter-spacing:.01em}
.hero .tag{display:inline-flex;align-self:flex-start;font-weight:800;font-size:13px;letter-spacing:.08em;
  background:var(--ink);color:var(--paper);padding:3px 12px;border-radius:999px}
.hero .lead{color:var(--muted);font-weight:700}
.sheet{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r);
  box-shadow:5px 5px 0 var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet h2{font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px}
label.f small{font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=time],textarea,select{
  font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
  outline:3px solid var(--accent2);outline-offset:2px}
.btn{font:inherit;font-weight:800;font-size:16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--on-accent,var(--ink));
  border:2.5px solid var(--line);border-radius:999px;padding:11px 22px;
  box-shadow:3px 3px 0 var(--line);text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.sub{background:var(--paper);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--paper);color:var(--ink);
  border:2px solid var(--line);border-radius:999px;padding:7px 14px;line-height:1.4}
.chip[aria-pressed=true]{background:var(--accent);box-shadow:2px 2px 0 var(--line)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;
  background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:10px 12px}
.note{font-size:13px;color:var(--muted)}
.result-img{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.result-img img{width:100%;border:2.5px solid var(--line);border-radius:14px;display:block}
.fallback{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-weight:800;padding:10px 18px;border-radius:999px;
  z-index:50;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* レイアウト: 夜空の上に大きな日数カウンター、その下に数字のステッカーを並べる。宇宙スケールの数字が主役 */
:root{--bg:#1d2156;--accent:#ffe14d;--accent2:#ff7ab0;--soft:#f3f1ff;--paper:#fffaf0;--sky-ink:#fffaf0;--sky-muted:#c7cbf3;color-scheme:dark}
body{color:var(--sky-ink);background-color:var(--bg);
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90px 80px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 150px 20px,#ffe9a3 50%,transparent 51%),radial-gradient(1px 1px at 60px 140px,#fff 50%,transparent 51%);
  background-size:180px 180px}
.hero .lead{color:var(--sky-muted)}
.hero .tag{background:var(--accent);color:var(--ink)}
.sheet{color:var(--ink)}
.sheet input{color-scheme:light}
.counter{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.counter .big{font-family:var(--f-display);font-size:clamp(56px,17vw,96px);line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:4px 4px 0 #0d0f2e}
.counter .unit{font-family:var(--f-display);font-size:28px}
.counter .sec{font-weight:800;color:var(--sky-muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--paper);color:var(--ink);border:2.5px solid #0d0f2e;border-radius:16px;box-shadow:4px 4px 0 #0d0f2e;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:12px;font-weight:800;color:var(--muted)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.mile{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mile li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.mile b{font-weight:800}
.mile em{font-style:normal;font-family:var(--f-display);font-size:18px;color:var(--accent2);white-space:nowrap}
.ex{font-size:12px;font-weight:800;background:var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px;align-self:flex-start}

body{margin:0;padding-top:calc(20px + env(safe-area-inset-top,0px))}
</style>

<body>

<div class="wrap">
  <header class="hero">
    <span class="tag">数字でみる自分</span>
    <h1>生まれてから何日？</h1>
    <p class="lead">誕生日を入れると、生きてきた日数や、心臓が動いた回数、地球と一緒に旅した距離がわかるよ。</p>
  </header>

  <section class="sheet">
    <label class="f">誕生日<small>入力はこの画面の中だけで使われて、どこにも送られません</small>
      <input type="date" id="birth" value="2010-04-15" max="">
    </label>
    <span class="ex" id="ex">いまは例として 2010年4月15日 生まれで表示中</span>
  </section>

  <div class="counter" aria-live="polite">
    <span class="unit">生まれてから</span>
    <span class="big" id="days">0</span>
    <span class="unit">日目</span>
    <span class="sec" id="secs"></span>
  </div>

  <div class="stats" id="stats"></div>

  <section class="sheet">
    <h2>もうすぐ来る記念日</h2>
    <ul class="mile" id="mile"></ul>
  </section>

  <section class="sheet">
    <h2>シェア用カード</h2>
    <div class="result-img" id="img"></div>
  </section>

  <p class="note" style="color:var(--sky-muted)">心拍は1分80回、呼吸は1分16回、まばたきは起きている間1分15回、睡眠は1日8時間、食事は1日3回として計算した目安です。</p>
</div>

<script>/* 共通ヘルパー: コード化、コピー、Xシェア、結果画像 */
const K = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function enc(o) {
    const b = new TextEncoder().encode(JSON.stringify(o));
    let bin = ""; b.forEach(x => bin += String.fromCharCode(x));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function dec(t, kind) {
    try {
      const runs = String(t || "").match(/[A-Za-z0-9_-]{10,}/g);
      if (!runs) return null;
      runs.sort((a, b) => b.length - a.length);
      for (const c of runs) {
        try {
          let s = c.replace(/-/g, "+").replace(/_/g, "/");
          while (s.length % 4) s += "=";
          const bin = atob(s);
          const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
          if (o && (!kind || o.k === kind)) return o;
        } catch (e) { /* 次の候補へ */ }
      }
    } catch (e) {}
    return null;
  }
  function fromHash(kind) {
    try { const h = location.hash.slice(1); return h.length > 10 ? dec(h, kind) : null; } catch (e) { return null; }
  }

  let toastTimer;
  function toast(msg) {
    let t = $(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
  }

  function copy(text, fallbackEl) {
    const done = () => toast("コピーしたよ！");
    const fail = () => {
      if (fallbackEl) {
        fallbackEl.hidden = false; fallbackEl.value = text;
        fallbackEl.focus(); fallbackEl.select();
        toast("選択した文字をコピーしてね");
      } else toast("コピーできなかったよ");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
      else fail();
    } catch (e) { fail(); }
  }

  const tweet = text => "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);

  function hash(str) { let h = 2166136261; for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const pick = (arr, r) => arr[Math.floor((r ? r() : Math.random()) * arr.length)];

  /* ---------- canvas ---------- */
  async function fonts() {
    try {
      await Promise.race([
        Promise.all([
          document.fonts.load('40px "Dela Gothic One"', "あア"),
          document.fonts.load('800 20px "M PLUS Rounded 1c"', "あア"),
          document.fonts.load('500 20px "M PLUS Rounded 1c"', "あア"),
        ]),
        new Promise(r => setTimeout(r, 2500)),
      ]);
    } catch (e) {}
  }
  const FD = '"Dela Gothic One","Hiragino Sans",sans-serif';
  const FB = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
  function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return { c, x: c.getContext("2d") }; }
  function rr(x, X, Y, W, H, R) { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
  function sticker(x, X, Y, W, H, R, fill, ink, off = 10) {
    rr(x, X + off, Y + off, W, H, R); x.fillStyle = ink; x.fill();
    rr(x, X, Y, W, H, R); x.fillStyle = fill; x.fill(); x.lineWidth = 6; x.strokeStyle = ink; x.stroke();
  }
  function wrap(x, text, maxW) {
    const out = []; let line = "";
    for (const ch of String(text)) {
      if (ch === "\n") { out.push(line); line = ""; continue; }
      if (x.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch;
    }
    if (line) out.push(line);
    return out;
  }
  function fit(x, text, maxW, size, family, weight = "") {
    let s = size;
    do { x.font = `${weight} ${s}px ${family}`; s -= 2; } while (x.measureText(text).width > maxW && s > 12);
  }
  function dots(x, W, H, color, gap = 34, r = 3) {
    x.fillStyle = color;
    for (let yy = 0; yy < H; yy += gap) for (let xx = (yy / gap) % 2 ? gap / 2 : 0; xx < W; xx += gap) { x.beginPath(); x.arc(xx, yy, r, 0, 7); x.fill(); }
  }


  const pageURL = () => location.origin + location.pathname;
  function showImage(c, box, filename, shareText) {
    const url = c.toDataURL("image/png");
    const full = shareText ? shareText + "\n" + pageURL() : "";
    box.innerHTML = `<img alt="結果画像" src="${url}">
      <p class="note">画像を長押し（パソコンは右クリック）でも保存できるよ</p>
      <div class="row">
        <button class="btn" type="button" data-save>画像を保存・シェア</button>
        ${full ? `<a class="btn dark" target="_blank" rel="noopener" href="${tweet(full)}">Xでシェア</a>` : ""}
      </div>`;
    box.querySelector("[data-save]").addEventListener("click", () => {
      c.toBlob(async blob => {
        if (!blob) return;
        const file = new File([blob], filename, { type: "image/png" });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: full }); return; }
        } catch (e) { if (e && e.name === "AbortError") return; }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast("保存したよ！");
      }, "image/png");
    });
  }

  function store(key, val) {
    try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
  }

  return { $, $$, esc, enc, dec, fromHash, toast, copy, tweet, hash, rng, pick, fonts, FD, FB, canvas, rr, sticker, wrap, fit, dots, showImage, store };
})();
</script>
<script>
const inp = K.$("#birth");
const pad = n => String(n).padStart(2, "0");
const now0 = new Date(); inp.max = `${now0.getFullYear()}-${pad(now0.getMonth() + 1)}-${pad(now0.getDate())}`;
const DAY = 86400000, WD = "日月火水木金土";
const utc = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
const fmt = n => Math.round(n).toLocaleString("ja-JP");
function jp(n) {
  if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "億";
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString("ja-JP") + "万";
  return fmt(n);
}
const dstr = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;

function birth() { const v = inp.value; if (!v) return null; const [y, m, d] = v.split("-").map(Number); const b = new Date(y, m - 1, d); return b > new Date() ? null : b; }
function calc(b) {
  const t = new Date(), days = Math.floor((utc(t) - utc(b)) / DAY) + 1, lived = (t - b) / 60000;
  const awake = lived * 16 / 24;
  return { days, lived, stats: [
    ["生きた時間", fmt(lived / 60) + "時間", "分にすると " + jp(lived) + " 分"],
    ["心臓が動いた回数", "約" + jp(lived * 80) + "回", "休まずずっと"],
    ["呼吸した回数", "約" + jp(lived * 16) + "回", ""],
    ["まばたき", "約" + jp(awake * 15) + "回", "起きている間だけ"],
    ["寝ていた時間", "約" + (lived / 60 / 24 / 3 / 365.25).toFixed(1) + "年分", "人生の3分の1"],
    ["食べたごはん", "約" + fmt((days - 365) * 3 > 0 ? (days - 365) * 3 : 0) + "食", "1歳からの3食で計算"],
    ["地球と旅した距離", "約" + jp(days * 2573000) + "km", "太陽のまわりを進んだ道のり"],
    ["見られた満月", "約" + fmt(days / 29.53) + "回", "晴れていればね"],
  ] };
}
function milestones(b, days) {
  const out = [], add = (n, label) => { const d = new Date(b.getFullYear(), b.getMonth(), b.getDate() + n - 1); out.push([label, d, n - days]); };
  const k = Math.ceil((days + 1) / 1000) * 1000; add(k, `生誕${k.toLocaleString()}日`);
  if (k + 1000 - days < 2500) add(k + 1000, `生誕${(k + 1000).toLocaleString()}日`);
  for (let L = 4; L <= 5; L++) for (let dgt = 1; dgt <= 9; dgt++) { const z = +String(dgt).repeat(L); if (z > days && z - days < 1200) add(z, `ゾロ目の${z.toLocaleString()}日`); }
  const nb = new Date(new Date().getFullYear(), b.getMonth(), b.getDate()); if (utc(nb) < utc(new Date())) nb.setFullYear(nb.getFullYear() + 1);
  const left = Math.round((utc(nb) - utc(new Date())) / DAY);
  out.push([left === 0 ? "今日はお誕生日！" : `${nb.getFullYear() - b.getFullYear()}歳の誕生日`, nb, left]);
  const tenK = 10000; if (days < tenK) add(tenK, "生誕10,000日（大人の節目）");
  return out.sort((a, c) => a[2] - c[2]).slice(0, 5);
}

let cur = null;
function render() {
  const b = birth();
  K.$("#ex").hidden = inp.value !== "2010-04-15";
  if (!b) { K.$("#days").textContent = "—"; K.$("#stats").innerHTML = ""; K.$("#mile").innerHTML = `<li>未来の日付は入れられないよ</li>`; return; }
  cur = calc(b);
  K.$("#days").textContent = cur.days.toLocaleString("ja-JP");
  K.$("#stats").innerHTML = cur.stats.map(([l, v, s]) => `<div class="stat"><small>${l}</small><b>${v}</b>${s ? `<span>${s}</span>` : ""}</div>`).join("");
  const ms = milestones(b, cur.days);
  K.$("#mile").innerHTML = ms.map(([l, d, left]) => `<li><span><b>${l}</b><br><span class="note">${dstr(d)}</span></span><em>${left === 0 ? "今日！" : `あと${left}日`}</em></li>`).join("");
  drawCard(b, cur, ms[0]);
}
function tick() {
  const b = birth(); if (!b) return;
  K.$("#secs").textContent = `いまこの瞬間で ${fmt((Date.now() - b) / 1000)} 秒`;
}
async function drawCard(b, r, m) {
  await K.fonts();
  const W = 1080, H = 1350, { c, x } = K.canvas(W, H);
  x.fillStyle = "#1d2156"; x.fillRect(0, 0, W, H);
  const rnd = K.rng(7); for (let i = 0; i < 160; i++) { x.fillStyle = i % 9 ? "#ffffff" : "#ffe9a3"; x.globalAlpha = .4 + rnd() * .6; x.beginPath(); x.arc(rnd() * W, rnd() * H, rnd() * 3 + .6, 0, 7); x.fill(); }
  x.globalAlpha = 1;
  x.textAlign = "center"; x.textBaseline = "alphabetic";
  x.fillStyle = "#fffaf0"; x.font = `60px ${K.FD}`; x.fillText("生まれてから", 540, 190);
  x.fillStyle = "#0d0f2e"; x.font = `230px ${K.FD}`; const ds = r.days.toLocaleString("ja-JP"); K.fit(x, ds, 940, 230, K.FD); x.fillText(ds, 548, 448);
  x.fillStyle = "#ffe14d"; x.fillText(ds, 540, 440);
  x.fillStyle = "#fffaf0"; x.font = `60px ${K.FD}`; x.fillText("日目", 540, 540);
  const pick = [r.stats[1], r.stats[6], r.stats[4]];
  pick.forEach(([l, v], i) => {
    const y = 610 + i * 170;
    K.sticker(x, 120, y, 840, 130, 30, "#fffaf0", "#0d0f2e", 10);
    x.fillStyle = "#5d5470"; x.textAlign = "left"; x.font = `800 34px ${K.FB}`; x.fillText(l, 160, y + 78);
    x.fillStyle = "#1d1630"; x.textAlign = "right"; K.fit(x, v, 470, 52, K.FD); x.fillText(v, 920, y + 84);
  });
  x.textAlign = "center";
  if (m) { x.fillStyle = "#ff7ab0"; K.fit(x, `${m[0]}まで あと${m[2]}日`, 900, 52, K.FD); x.fillText(m[2] === 0 ? m[0] : `${m[0]}まで あと${m[2]}日`, 540, 1180); }
  x.fillStyle = "#c7cbf3"; x.font = `800 34px ${K.FB}`; x.fillText("#生まれてから何日", 540, 1270);
  K.showImage(c, K.$("#img"), "umarete-kara.png", `生まれてから${ds}日目！${m ? `${m[0]}まであと${m[2]}日` : ""}\n#生まれてから何日`);
}
